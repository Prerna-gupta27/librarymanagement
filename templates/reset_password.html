{% extends 'base.html' %}
{% block content %}
  <section class="card">
    <div class="section-head">
      <div>
        <p class="eyebrow">Security</p>
        <h2>Reset Your Password</h2>
      </div>
    </div>

    <form method="post" class="form-grid">
      <div class="form-row full-width">
        <label>Current Password *</label>
        <input name="current_password" type="password" required />
      </div>

      <div class="form-row full-width">
        <label>New Password *</label>
        <input name="new_password" type="password" minlength="6" required />
      </div>

      <div class="form-row full-width">
        <label>Confirm New Password *</label>
        <input name="confirm_password" type="password" minlength="6" required />
      </div>

      <div class="form-row full-width button-row">
        <button class="btn btn-primary" type="submit">Update Password</button>
      </div>
    </form>

    <p class="small" style="margin: 0 18px 18px;">Use at least 6 characters and keep your account credentials private.</p>
  </section>
{% endblock %}
