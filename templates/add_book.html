{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <div class="card-body">
      <form method="post" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Title *</label>
          <input class="form-control" name="title" required value="{{ form.title or '' }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Author *</label>
          <input class="form-control" name="author" required value="{{ form.author or '' }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Publisher</label>
          <input class="form-control" name="publisher" value="{{ form.publisher or '' }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label">ISBN</label>
          <input class="form-control" name="isbn" value="{{ form.isbn or '' }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Published Year</label>
          <input class="form-control" name="published_year" type="number" min="0" value="{{ form.published_year or '' }}" />
        </div>

        <div class="col-12">
          <label class="form-label">Accession numbers (optional, one per line)</label>
          <textarea class="form-control" name="accession_numbers" rows="4" placeholder="ACC-001\nACC-002">{{ form.accession_numbers or '' }}</textarea>
          <div class="form-text">If you add copies here, they can be issued immediately.</div>
        </div>

        <div class="col-12">
          <button class="btn btn-success" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
