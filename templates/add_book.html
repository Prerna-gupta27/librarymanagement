{% extends 'base.html' %}
{% block content %}
  <section class="card">
    <div class="section-head">
      <div>
        <p class="eyebrow">Acquisition Desk</p>
        <h2>Add a Book and Optional Physical Copies</h2>
      </div>
      <a class="btn btn-muted" href="{{ url_for('books') }}">Back to Catalog</a>
    </div>

    <form method="post" class="form-grid">
      <div class="form-row">
        <label>Title *</label>
        <input name="title" required value="{{ form.title or '' }}" />
      </div>

      <div class="form-row">
        <label>Author *</label>
        <input name="author" required value="{{ form.author or '' }}" />
      </div>

      <div class="form-row">
        <label>Publisher</label>
        <input name="publisher" value="{{ form.publisher or '' }}" />
      </div>

      <div class="form-row">
        <label>ISBN</label>
        <input name="isbn" value="{{ form.isbn or '' }}" />
      </div>

      <div class="form-row">
        <label>Published Year</label>
        <input name="published_year" type="number" min="0" value="{{ form.published_year or '' }}" />
      </div>

      <div class="form-row full-width">
        <label>Accession Numbers (optional, one per line)</label>
        <textarea name="accession_numbers" rows="5" placeholder="ACC-001\nACC-002">{{ form.accession_numbers or '' }}</textarea>
        <div class="small">Copies entered here become immediately issuable if IDs are unique.</div>
      </div>

      <div class="form-row full-width button-row">
        <button class="btn btn-primary" type="submit">Save Book</button>
      </div>
    </form>
  </section>
{% endblock %}
