{% extends 'base.html' %}
{% block content %}
  <section class="card">
    <div class="section-head">
      <div>
        <p class="eyebrow">Circulation Desk</p>
        <h2>Issue a Physical Copy</h2>
      </div>
      <a class="btn btn-muted" href="{{ url_for('active_issues') }}">View Active Issues</a>
    </div>

    <p class="small">Only active members and currently available copies are shown. Due date is auto-computed from member policy.</p>

    <form method="post" class="form-grid">
      <div class="form-row full-width">
        <label>Member *</label>
        <select name="member_id" required>
          <option value="">-- Select --</option>
          {% for m in members %}
            <option value="{{ m.member_id }}" {% if form.member_id == (m.member_id|string) %}selected{% endif %}>
              #{{ m.member_id }} - {{ m.full_name }} ({{ m.type_name }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row full-width">
        <label>Copy (Available) *</label>
        <select name="copy_id" required>
          <option value="">-- Select --</option>
          {% for c in copies %}
            <option value="{{ c.copy_id }}" {% if form.copy_id == (c.copy_id|string) %}selected{% endif %}>
              Copy #{{ c.copy_id }} - {{ c.accession_no }} - {{ c.title }} by {{ c.author }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row full-width button-row">
        <button class="btn btn-primary" type="submit">Issue Book</button>
      </div>
    </form>
  </section>
{% endblock %}
